<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS LegalTech Control - Login</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="manifest" href="manifest.json">

</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h1>JS LegalTech Control</h1>
            <p>Sistema Integral para Despachos Jurídicos</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="usuario">Usuario / Correo</label>
                <input type="text" id="usuario" required placeholder="ejemplo.abogado">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary">Iniciar sesión</button>
        </form>
        
        <div class="login-footer">
            <p>© 2026 JS LegalTech & Ingeniería</p>
        </div>
    </div>

    <!-- Scripts de dependencias globales primero -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>

    <!-- Lógica local del formulario de Login -->
    <script>
        const USUARIOS_MOCK = [
            {
                id: 1,
                usuario: "jorge.sanchez",
                nombre: "Jorge Sánchez Flores",
                rol: "Administrador",
                pass: "admin2026"
            },
            {
                id: 2,
                usuario: "abogado.demo",
                nombre: "Lic. Alejandro Martínez",
                rol: "Abogado",
                pass: "abogado123"
            },
            {
                id: 3,
                usuario: "cliente.demo",
                nombre: "Juan Pérez (Cliente)",
                rol: "Cliente",
                pass: "cliente123"
            }
        ];

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuarioInput = document.getElementById('usuario').value.trim();
            const passwordInput = document.getElementById('password').value;
            
            // Búsqueda del usuario en el entorno local mockeado
            const usuarioValido = USUARIOS_MOCK.find(u => u.usuario === usuarioInput && u.pass === passwordInput);
            
            if (usuarioValido) {
                const sesion = {
                    id: usuarioValido.id,
                    nombre: usuarioValido.nombre,
                    rol: usuarioValido.rol,
                    token: "tk_" + Math.random().toString(36).substring(2, 11)
                };
                
                // Persistencia de la sesión de forma segura
                localStorage.setItem('js_legal_session', JSON.stringify(sesion));
                window.location.href = 'dashboard.html';
            } else {
                alert('❌ Usuario o contraseña incorrectos. Verifica tus datos.');
            }
        });
    </script>

   <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker registrado con éxito.'))
      .catch(err => console.log('Error al registrar Service Worker:', err));
  }
    </script>

</body>
</html>
