<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="img/favicon3.png">
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JS LegalTech Control</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="manifest" href="manifest.json">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="login-header">
            <img
                src="img/logo-js-legal2.png"
                alt="LexGear, símbolo de JS Legal & Ingeniería"
                class="login-lexgear-logo"
            >
            <span class="login-symbol-name">LexGear</span>
            <h1>JS LegalTech Control</h1>
            <p class="login-tagline">Sistema Integral para Despachos Jurídicos</p>
            <p class="login-developed">Developed by JS Legal &amp; Ingeniería</p>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="form-group">
                <label for="usuario">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="usuario"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="correo@despacho.com"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                >
            </div>

            <label style="
                display:flex;
                align-items:center;
                gap:.55rem;
                margin:0 0 1.2rem;
                font-size:.9rem;
                cursor:pointer;
            ">
                <input
                    type="checkbox"
                    id="recordar-sesion"
                    checked
                    style="width:auto;"
                >
                Mantener mi sesión iniciada
            </label>

            <button
                type="submit"
                class="btn-primary"
            >
                Iniciar sesión
            </button>
        </form>

        <form id="cambio-password-form" hidden autocomplete="off">
            <div style="margin-bottom:1rem;padding:12px;border-radius:8px;background:#eff6ff;color:#1e3a8a;font-size:.9rem;line-height:1.45;">
                <strong>Cambio obligatorio de contraseña</strong><br>
                Estás usando una contraseña temporal. Define una contraseña personal antes de entrar al sistema.
            </div>

            <div class="form-group">
                <label for="cambio-correo">Correo autenticado</label>
                <input type="email" id="cambio-correo" readonly tabindex="-1">
            </div>

            <div class="form-group">
                <label for="nueva-password">Nueva contraseña</label>
                <input type="password" id="nueva-password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
            </div>

            <div class="form-group">
                <label for="confirmar-password">Confirmar nueva contraseña</label>
                <input type="password" id="confirmar-password" required minlength="8" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary">Guardar nueva contraseña</button>
            <button type="button" id="cancelar-cambio-password" style="width:100%;margin-top:.65rem;padding:.75rem;border:1px solid #cbd5e1;border-radius:6px;background:white;cursor:pointer;">Cancelar y cerrar sesión</button>
        </form>

        <div class="login-footer">
            <p>© 2026 JS Legal &amp; Ingeniería</p>
        </div>
    </main>

    <!-- Firebase debe cargarse antes de firebase.js y auth.js -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("sw.js")
                .then(() => {
                    console.log(
                        "Service Worker registrado con éxito."
                    );
                })
                .catch(error => {
                    console.error(
                        "Error al registrar Service Worker:",
                        error
                    );
                });
        }
    </script>
</body>
</html>
