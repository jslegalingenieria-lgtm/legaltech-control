<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JS LegalTech Control - Login</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="manifest" href="manifest.json">
</head>

<body class="login-body">
    <main class="login-card">
        <div class="login-header">
            <h1>JS LegalTech Control</h1>
            <p>Sistema Integral para Despachos Jurídicos</p>
        </div>

        <form id="login-form" autocomplete="on">
            <div class="form-group">
                <label for="usuario">
                    Usuario, correo o nombre
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="username"
                    required
                    autocomplete="username"
                    placeholder="ejemplo.abogado"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                >
            </div>

            <label style="
                display:flex;
                align-items:center;
                gap:.55rem;
                margin:0 0 1.2rem;
                font-size:.9rem;
                cursor:pointer;
            ">
                <input
                    type="checkbox"
                    id="recordar-sesion"
                    checked
                    style="width:auto;"
                >
                Mantener mi sesión iniciada
            </label>

            <button
                type="submit"
                class="btn-primary"
            >
                Iniciar sesión
            </button>
        </form>

        <div class="login-footer">
            <p>© 2026 JS LegalTech & Ingeniería</p>
        </div>
    </main>

    <!-- Firebase debe cargarse antes de firebase.js y auth.js -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("sw.js")
                .then(() => {
                    console.log(
                        "Service Worker registrado con éxito."
                    );
                })
                .catch(error => {
                    console.error(
                        "Error al registrar Service Worker:",
                        error
                    );
                });
        }
    </script>
</body>
</html>
